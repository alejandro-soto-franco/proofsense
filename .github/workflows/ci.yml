# Format, lint and test gate.
#
# release.yml is generated by cargo-dist and must not be hand-edited; this file
# is separate and hand-maintained.
#
# The Lean project under lean/ is not built here. It depends on Mathlib, so a
# build costs far more runner time than the Rust gate, and nothing in the Rust
# suite spawns Lean: every test supplies a captured declaration record instead.
# Changes under lean/ therefore pass this gate unchecked.
#
# The suite is offline by construction. PROOFSENSE_ENABLE_LLM is never set
# here, so no test reaches the network or needs a key.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Floating stable, matching what release.yml installs. A new stable can
      # introduce a lint and turn this red on an unrelated push; that is the
      # cost of keeping the two in step.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # --locked fails if Cargo.lock would have to change, so the committed
      # lockfile stays the one that is actually built.
      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked
