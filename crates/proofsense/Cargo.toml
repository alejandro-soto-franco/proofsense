[package]
name = "proofsense"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Proof-linting against reviewable literature"
repository = "https://github.com/alejandro-soto-franco/proofsense"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

[lib]
name = "proofsense"
path = "src/lib.rs"

[[bin]]
name = "proofsense"
path = "src/main.rs"
